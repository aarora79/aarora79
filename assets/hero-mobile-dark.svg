<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486" width="720" height="486" role="img" aria-labelledby="title desc">
  <title id="title">Amit Arora</title>
  <desc id="desc">Agentic AI infrastructure, MCP, and agent evaluation. Principal Solutions Architect, AI/ML at AWS. Adjunct Professor, Georgetown University.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#0f182b"/>
      <stop offset="100%" stop-color="#141d33"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.22" r="0.6">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#58a6ff"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.15"/>
    </linearGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8b949e" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <style>
      .name  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
               font-size: 62px; font-weight: 700; letter-spacing: -1px; fill: #f0f6fc; }
      .focus { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
               font-size: 31px; font-weight: 500; fill: #79c0ff; }
      .meta  { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
               font-size: 26px; font-weight: 400; fill: #8b949e; }
    </style>
  </defs>

  <rect width="720" height="486" fill="url(#bg)"/>
  <rect width="720" height="486" fill="url(#grid)"/>
  <rect width="720" height="486" fill="url(#glow)"/>

  <!-- hub and spoke motif: a gateway routing agents to tools -->
  <g transform="translate(360 108)" fill="none" stroke="#58a6ff">
    <circle r="86" stroke-opacity="0.14" stroke-dasharray="3 7"/>
    <g stroke-opacity="0.38" stroke-width="1.6">
      <path d="M0 0 L68 0"/>
      <path d="M0 0 L34 -59"/>
      <path d="M0 0 L-34 -59"/>
      <path d="M0 0 L-68 0"/>
      <path d="M0 0 L-34 59"/>
      <path d="M0 0 L34 59"/>
    </g>
    <g fill="#0f182b" stroke="#58a6ff" stroke-opacity="0.75" stroke-width="2">
      <circle cx="68" cy="0" r="10"/>
      <circle cx="34" cy="-59" r="10"/>
      <circle cx="-34" cy="-59" r="10"/>
      <circle cx="-68" cy="0" r="10"/>
      <circle cx="-34" cy="59" r="10"/>
      <circle cx="34" cy="59" r="10"/>
    </g>
    <circle r="23" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff" stroke-opacity="0.9" stroke-width="2.4"/>
    <circle r="6" fill="#79c0ff" stroke="none"/>
  </g>

  <text class="name" x="360" y="272" text-anchor="middle">Amit Arora</text>
  <rect x="292" y="294" width="136" height="4" rx="2" fill="url(#rule)"/>
  <text class="focus" x="360" y="344" text-anchor="middle">Agentic AI infrastructure</text>
  <text class="focus" x="360" y="380" text-anchor="middle">MCP and agent evaluation</text>
  <text class="meta" x="360" y="420" text-anchor="middle">Principal Solutions Architect, AI/ML at AWS</text>
  <text class="meta" x="360" y="452" text-anchor="middle">Adjunct Professor, Georgetown University</text>
</svg>
